# ============================================================
# RENDER BLUEPRINT — Fortune U Group (fortuneugroup.in)
# Static HTML site: no build step, no server, always awake.
# Docs: https://render.com/docs/blueprint-spec
# ============================================================
services:
  - type: web
    name: fortuneugroup
    runtime: static        # Static Site runtime (free, CDN-backed, never sleeps)
    branch: main
    # index.html is at the repo root -> publish root folder
    staticPublishPath: ./
    # Same security headers we used to set in vercel.json
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Cache static assets for 1 day
      - path: /images/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /css/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /js/*
        name: Cache-Control
        value: public, max-age=86400

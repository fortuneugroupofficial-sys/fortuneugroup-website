# =============================================================================
# README: this is a REFERENCE file, not an active GitHub Action.
# The session's GitHub App lacks the `workflows` permission to write
# `.github/workflows/*`, so this file lives here instead. To activate it:
#   1. Copy this file to:  .github/workflows/n8n-social-deploy.yml
#   2. Commit/push (you can do this from the GitHub web UI → Add file).
# =============================================================================
name: n8n social publishing deploy

# Deploys WF-07/08/09/10/15 to your n8n (imports, creates credentials from
# secrets, sets Variables, activates, smoke-tests the approval gate).
#
# Runs on a SELF-HOSTED runner installed on your Contabo VPS, so it can reach
# n8n at http://localhost:5678 without exposing n8n to the internet.

on:
  workflow_dispatch:
  push:
    paths:
      - "automation/n8n/workflows/WF-0[7-9]*.json"
      - "automation/n8n/workflows/WF-10*.json"
      - "automation/n8n/workflows/WF-15*.json"
      - "automation/deploy/deploy.sh"
      - ".github/workflows/n8n-social-deploy.yml"

jobs:
  deploy:
    runs-on: [self-hosted, fortuneugroup]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to n8n
        env:
          N8N_BASE_URL: "http://localhost:5678"
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          N8N_WEBHOOK_BASE: ${{ vars.N8N_WEBHOOK_BASE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID }}
          META_IG_ACCOUNT_ID: ${{ vars.META_IG_ACCOUNT_ID }}
          AUTO_PUBLISH: "false"
        run: bash automation/deploy/deploy.sh

# Fortune U Group — automation stack
# n8n (Community) + NocoDB + Postgres + Caddy reverse proxy.
#
# Production notes:
#   - Never commit .env (copy .env.example -> .env).
#   - Bind only the reverse proxy to host ports where possible.
#   - Back up the postgres volume and the n8n volume regularly.

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nocodb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nocodb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nocodb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # not exposed to host; reachable by other services on the internal network

  nocodb:
    image: nocodb/nocodb:latest
    restart: unless-stopped
    environment:
      NC_DB: "pg://postgres:5432?u=${POSTGRES_USER:-nocodb}&p=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}&d=${POSTGRES_DB:-nocodb}"
      NC_PUBLIC_URL: ${NOCODB_PUBLIC_URL:-http://localhost:8080}
      NC_DISABLE_TELE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - nocodb_data:/usr/app/data

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-0.0.0.0}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:?set N8N_BASIC_AUTH_USER in .env}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:?set N8N_BASIC_AUTH_PASSWORD in .env}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-https://n8n.fortuneugroup.in}
      WEBHOOK_URL: ${WEBHOOK_URL:-https://n8n.fortuneugroup.in}
      N8N_WEBHOOK_BASE: ${N8N_WEBHOOK_BASE:-https://n8n.fortuneugroup.in}
      META_PAGE_ID: ${META_PAGE_ID:-}
      META_IG_ACCOUNT_ID: ${META_IG_ACCOUNT_ID:-}
      # Secrets consumed by workflows via $env (never in workflow JSON):
      FUG_WEBHOOK_SECRET: ${FUG_WEBHOOK_SECRET:-}
      NOCODB_URL: ${NOCODB_URL:-http://nocodb:8080}
      NOCODB_API_TOKEN: ${NOCODB_API_TOKEN:-}
      NOCODB_LEADS_TABLE_ID: ${NOCODB_LEADS_TABLE_ID:-}
      NOCODB_CONTACTS_TABLE_ID: ${NOCODB_CONTACTS_TABLE_ID:-}
      NOCODB_INTERACTIONS_TABLE_ID: ${NOCODB_INTERACTIONS_TABLE_ID:-}
      NOCODB_FOLLOWUPS_TABLE_ID: ${NOCODB_FOLLOWUPS_TABLE_ID:-}
      NOCODB_CONTENT_TABLE_ID: ${NOCODB_CONTENT_TABLE_ID:-}
      NOCODB_SOCIALPOSTS_TABLE_ID: ${NOCODB_SOCIALPOSTS_TABLE_ID:-}
      NOCODB_TASKS_TABLE_ID: ${NOCODB_TASKS_TABLE_ID:-}
      NOCODB_APPROVALS_TABLE_ID: ${NOCODB_APPROVALS_TABLE_ID:-}
      NOCODB_AUTOMATIONLOGS_TABLE_ID: ${NOCODB_AUTOMATIONLOGS_TABLE_ID:-}
      NOCODB_ERRORS_TABLE_ID: ${NOCODB_ERRORS_TABLE_ID:-}
      AUTO_PUBLISH: ${AUTO_PUBLISH:-false}
      FOLLOWUP_INTERVAL_HOURS: ${FOLLOWUP_INTERVAL_HOURS:-24}
      FOLLOWUP_MAX_ATTEMPTS: ${FOLLOWUP_MAX_ATTEMPTS:-3}
      WA_RATE_LIMIT_PER_HOUR: ${WA_RATE_LIMIT_PER_HOUR:-50}
      WA_TOKEN: ${WA_TOKEN:-}
      WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID:-}
      WA_WABA_ID: ${WA_WABA_ID:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_PAGE_ID: ${META_PAGE_ID:-}
      META_IG_ACCOUNT_ID: ${META_IG_ACCOUNT_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Optional: use Postgres for n8n persistence/queue (recommended for production)
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${N8N_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-nocodb}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "5678"
    volumes:
      - n8n_data:/home/node/.n8n

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - n8n
      - nocodb
    ports:
      - "80:80"
      - "443:443"
    environment:
      N8N_DOMAIN: ${N8N_DOMAIN:-n8n.fortuneugroup.in}
      CRM_DOMAIN: ${CRM_DOMAIN:-crm.fortuneugroup.in}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  nocodb_data:
  n8n_data:
  caddy_data:
  caddy_config:
